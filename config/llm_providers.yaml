# OB1 — Registry provider LLM (routing free-tier first)
#
# Il gateway (src/llm/gateway.py) parla SOLO OpenAI-compatible /chat/completions.
# Ogni provider qui sotto espone quell'endpoint, Gemini incluso (compat layer).
#
# Regole:
#   - `limits` sono i tetti del free tier: il ledger li fa rispettare PRIMA
#     della chiamata, non dopo il 429. Metti valori conservativi (~80% del reale).
#   - `commercial_use: false` => il modello NON entra in output cliente (K-Sport).
#   - `trains_on_data: true` => niente dati sensibili/non pubblici nel prompt.
#   - `priority` più basso = provato prima. Il router prende il primo bucket
#     disponibile per la task class richiesta.
#   - `api_key_env` può contenere più chiavi separate da virgola: ogni chiave
#     diventa un bucket indipendente (sharding orizzontale del free tier).
#
# Verificare i limiti ogni ~3 mesi: i free tier cambiano spesso.
# Ultimo check: 2026-08-02.

version: 1

defaults:
  timeout_s: 90
  max_tokens: 2048
  temperature: 0.0
  # Backoff quando un bucket restituisce 5xx / errore transitorio
  cooldown_transient_s: 60
  # Fallimenti consecutivi prima di spegnere il bucket per il resto della run
  fail_streak_limit: 3

# Classi di task: dicono al router che qualità serve e quanto costa sbagliare.
task_classes:
  triage:
    # Classificazione binaria / filtro junk. Modelli piccoli bastano.
    description: "is_player? is_junk? tipo opportunità"
    min_tier: nano
    max_input_chars: 6000
    cache_ttl_h: 720
  extract:
    # Parsing strutturato da testo GIÀ scaricato (TM, articoli).
    # È il 90% del volume: deve girare su tier free abbondanti.
    description: "HTML/testo -> JSON profilo giocatore"
    min_tier: small
    max_input_chars: 24000
    cache_ttl_h: 336
  reason:
    # Giudizio scouting, dedup semantico, sintesi report cliente.
    # Volume basso, qualità alta: qui servono i frontier.
    description: "sintesi scouting, dedup, valutazione"
    min_tier: frontier
    max_input_chars: 32000
    cache_ttl_h: 168

providers:
  # --- Volume alto, token/giorno generosi: cavalli da soma dell'extract ---
  - id: cerebras
    base_url: https://api.cerebras.ai/v1
    api_key_env: CEREBRAS_API_KEY
    commercial_use: true
    trains_on_data: false
    limits:
      rpm: 25
      rpd: null
      tpd: 900000
    models:
      - name: llama-3.3-70b
        tier: mid
        context: 128000
        json_mode: true
        tasks: [triage, extract]
        priority: 12
      - name: qwen-3-235b-a22b-instruct
        tier: frontier
        context: 128000
        json_mode: true
        tasks: [extract, reason]
        priority: 20

  - id: groq
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    commercial_use: true
    trains_on_data: false
    limits:
      rpm: 25
      rpd: 900
      tpm: 12000
      tpd: 90000
    models:
      # llama-3.3-70b-versatile RITIRATO da Groq (19 ago 2026, stessa data e
      # stesso identico HTTP 404 già diagnosticato in OB1 Global — vedi
      # ob1-scout PR #41/#43). Qui non era mai stato aggiornato: ogni run di
      # triage falliva su questa rotta (priority 10, la prima tentata),
      # buttando via i 162 articoli/run che le fonti RSS portano in ingresso.
      # gpt-oss-120b è il rimpiazzo verificato in produzione su Global da
      # settimane (non indovinato: misurato sul catalogo Groq reale).
      - name: openai/gpt-oss-120b
        tier: mid
        context: 128000
        json_mode: true
        tasks: [triage, extract]
        priority: 10
        # TPM piu' stretto del modello precedente (~8k contro ~12k, vedi
        # ob1-scout scripts/ingest_v2.py per la misura): prompt piu' corti.
        max_input_chars: 8000

  - id: mistral
    base_url: https://api.mistral.ai/v1
    api_key_env: MISTRAL_API_KEY
    commercial_use: true
    # Free tier Mistral = "Experiment": i dati possono essere usati per training
    trains_on_data: true
    limits:
      rpm: 30
      rpd: 2000
      tpm: 500000
    models:
      - name: mistral-small-latest
        tier: small
        context: 128000
        json_mode: true
        tasks: [triage, extract]
        priority: 25

  # --- Frontier gratis: volume basso, usare solo per `reason` ---
  - id: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    commercial_use: true
    trains_on_data: false
    limits:
      rpm: 18
      # 50/giorno senza credito, 1000/giorno dopo un top-up una tantum da $10
      rpd: 900
    extra_headers:
      HTTP-Referer: https://ob1-lega-pro.pages.dev
      X-Title: OB1 Lega Pro
    # Tutti e tre i modelli :free che stavano qui (deepseek-v3.2, qwen3-235b,
    # llama-3.3-70b) sono usciti dal tier gratuito di OpenRouter. Non e' una
    # congettura: al 30 ago 2026 nessuno dei tre e' nel catalogo /models, e
    # ognuno risponde 404 "This model is unavailable for free. The paid
    # version is available now - use this slug instead: <nome senza :free>".
    # Lo slug suggerito e' quello A PAGAMENTO: non e' un rimpiazzo per noi.
    #
    # I due qui sotto vengono dal catalogo reale (396 modelli) e sono stati
    # PROVATI, non scelti per assonanza — scripts/diagnose_llm_routes.py,
    # run del 30 ago 2026: entrambi hanno risposto con JSON valido in ~3s.
    # Famiglie diverse di proposito: se una cade, l'altra non cade con lei.
    #
    # Provati e scartati per ora, da riconsiderare: z-ai/glm-5.2:free e
    # google/gemma-4-31b-it:free. Esistono e sono gratuiti, ma al momento
    # della prova rispondevano 429 "temporarily rate-limited upstream ...
    # shared pool". E' una condizione transitoria del pool condiviso, non un
    # modello morto — solo, non avendoli visti funzionare, non li mettiamo
    # in produzione sulla fiducia.
    models:
      - name: minimax/minimax-m3:free
        tier: frontier
        context: 128000
        json_mode: true
        # triage incluso: task_classes.triage ha min_tier nano, e TIER_ORDER
        # esclude solo chi sta SOTTO il floor, mai chi sta sopra. Con groq
        # rate-limited e compare come unica alternativa, tenere i frontier
        # fuori dal triage lasciava la classificazione su due sole rotte.
        tasks: [triage, extract, reason]
        priority: 30
      - name: nvidia/nemotron-3-super-120b-a12b:free
        tier: frontier
        context: 128000
        json_mode: true
        tasks: [triage, extract, reason]
        priority: 35

  - id: nvidia_nim
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
    commercial_use: true
    trains_on_data: false
    limits:
      rpm: 20
      rpd: 900
    # deepseek-ai/deepseek-v3.1 stava qui e rispondeva "404 page not found" —
    # un 404 nudo, senza spiegazione, che sembrava un problema di endpoint.
    # Non lo era: al 30 ago 2026 quel nome non esiste nel catalogo NVIDIA
    # (83 modelli, letti da /v1/models). Su NVIDIA DeepSeek e' passato alla
    # v4 (deepseek-v4-flash-0731, deepseek-v4-pro-0813).
    #
    # I due qui sotto sono presi da quel catalogo e PROVATI il 30 ago 2026
    # (scripts/diagnose_llm_routes.py), non scelti per somiglianza di nome.
    #
    # Provato e scartato: openai/gpt-oss-120b. E' nel catalogo NVIDIA ed e'
    # la stessa famiglia che gira bene su groq e su Ollama, ma qui e' andato
    # in ReadTimeout a 60s. Stesso modello, infrastruttura diversa: e'
    # esattamente il motivo per cui un nome va provato sul provider dove lo
    # si vuole usare, non dedotto dal fatto che altrove funziona.
    models:
      # PRIORITA' DOPO compare (50), non prima. Due misure a 5 minuti di
      # distanza, stessi nomi, stesse chiavi:
      #
      #                                     18:59      19:04
      #   nemotron-3-super-120b-a12b        OK 1.7s    HTTP 503 overloaded
      #   deepseek-v4-flash-0731            OK 28.2s   ReadTimeout 60s
      #
      # Entrambe restano [in catalogo]: i nomi sono giusti, e' NVIDIA a
      # essere intermittente. Il problema non e' che ogni tanto falliscano
      # — il gateway lo gestisce — ma che a priorita' 45 fallivano PRIMA di
      # compare, che nelle stesse tre misure ha risposto 3 volte su 3 in
      # 1.4-1.6s. Un ReadTimeout da 60s davanti a una rotta da 1.4s costa un
      # minuto pieno a ogni chiamata che ci passa attraverso.
      #
      # Restano in config perche' quando NVIDIA risponde e' velocissima
      # (1.7s, il miglior tempo misurato di tutti i candidati) e allarga la
      # diversita' di fornitori. Ma si prova dopo chi e' costante, non prima.
      - name: nvidia/nemotron-3-super-120b-a12b
        tier: frontier
        context: 128000
        json_mode: true
        # triage incluso: min_tier nano non esclude i tier alti (TIER_ORDER
        # in src/llm/registry.py taglia solo verso il basso).
        tasks: [triage, extract, reason]
        priority: 55
      # Mai vista sotto i 28s, e al secondo giro andata in timeout a 60s:
      # fuori dal triage (un blocco ogni 8 articoli non puo' aspettare
      # tanto), e ultima riserva prima di Gemini su extract e reason.
      - name: deepseek-ai/deepseek-v4-flash-0731
        tier: frontier
        context: 128000
        json_mode: true
        tasks: [extract, reason]
        priority: 56

  # --- Gemini: da PRIMARIO a ultima spiaggia. Zero grounding (è quello che costa) ---
  - id: gemini
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
    commercial_use: true
    # Free tier Google: i prompt possono finire nel training fuori UE/UK/EEA
    trains_on_data: true
    limits:
      rpm: 10
      rpd: 180
    models:
      - name: gemini-2.5-flash
        # gemini-2.0-flash è deprecato (404): il default resta 2.5
        name_env: GEMINI_MODEL
        tier: mid
        context: 1000000
        json_mode: true
        tasks: [triage, extract, reason]
        priority: 80
      - name: gemini-2.5-flash-lite
        tier: small
        context: 1000000
        json_mode: true
        tasks: [triage, extract]
        priority: 85

  # --- Endpoint OpenAI-compatible self-hosted (COMPARE / LM Studio / Ollama).
  #     Attivo solo se COMPARE_BASE_URL è impostata. Nessuna chiave richiesta.
  - id: compare
    base_url_env: COMPARE_BASE_URL
    api_key_env: COMPARE_API_KEY
    requires_key: false
    commercial_use: true
    trains_on_data: false
    limits:
      rpm: 60
    models:
      - name: local-model
        name_env: COMPARE_MODEL
        tier: frontier
        context: 32000
        json_mode: false
        tasks: [triage, extract, reason]
        priority: 50

  # --- Ultimo anello: a pagamento, spento di default. Si accende solo con
  #     OB1_LLM_ALLOW_PAID=1 e serve a non far cadere la pipeline in un giorno nero.
  - id: openrouter_paid
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    commercial_use: true
    trains_on_data: false
    paid: true
    limits:
      rpm: 60
    models:
      - name: deepseek/deepseek-v3.2
        tier: frontier
        context: 163840
        json_mode: true
        tasks: [triage, extract, reason]
        priority: 999
