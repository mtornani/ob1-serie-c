[pytest]
# I test sono solo in tests/. Senza questo, pytest raccoglie anche
# scripts/test_compare_model.py — che e' uno script di confronto modelli, non
# un test, e all'import fa OB1_WATCH=0: da li' in poi il seen-store risponde
# "tutto nuovo" e cinque test del poller falliscono per contagio.
# La CI usa `python -m unittest discover -s tests` e non ha mai visto il problema.
testpaths = tests
